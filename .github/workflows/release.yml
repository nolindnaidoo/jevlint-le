# Manual release to three independent registries. Each is a separate opt-in,
# because none of them can be retried together: once a version is published it
# cannot be republished, so a run that publishes one and fails on another is
# only recoverable by re-running with the failed target selected alone.
#
# Open VSX defaults to OFF. `ovsx publish` takes no namespace argument — it
# derives the namespace from `publisher` in the VSIX — so enabling it publishes
# to whatever `package.json` currently names, with no confirmation prompt.
# Turn it on deliberately, once that namespace is the intended one.
#
# npm defaults to OFF for the same reason. The package is the command line and
# the MCP server in one.
name: Release

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      openvsx:
        description: Publish to Open VSX (check the target namespace first)
        type: boolean
        default: false
      npm:
        description: Publish the command line and MCP server to npm (jevlint-le)
        type: boolean
        default: false

# Publishing needs no write access to the repo itself; the registry tokens do
# all the privileged work and come from secrets.
permissions:
  contents: read

# Never let two publishes of the same ref race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every publish job is opt-in, so selecting none would otherwise run nothing
  # and report the workflow as successful — a green run that published nothing.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require at least one publish target
        env:
          MARKETPLACE: ${{ inputs.marketplace }}
          OPENVSX: ${{ inputs.openvsx }}
          NPM: ${{ inputs.npm }}
        run: |
          if [ "$MARKETPLACE" != "true" ] && [ "$OPENVSX" != "true" ] && [ "$NPM" != "true" ]; then
            echo "::error::No publish target selected."
            exit 1
          fi

  release:
    # The VSIX registries only. npm is a separate job because it holds
    # `id-token: write` to sign its provenance, and that permission should not
    # be held by a job handling registry PATs.
    if: inputs.marketplace || inputs.openvsx
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs before anything irreversible. A token discovered missing after a
      # publish leaves the release half-done and unrepeatable.
      - name: Check publish targets and credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          MARKETPLACE: ${{ inputs.marketplace }}
          OPENVSX: ${{ inputs.openvsx }}
        run: |
          fail=0
          if [ "$MARKETPLACE" = "true" ] && [ -z "$VSCE_PAT" ]; then
            echo "::error::Marketplace publishing requested but VSCE_PAT is not set."
            fail=1
          fi
          if [ "$OPENVSX" = "true" ] && [ -z "$OVSX_PAT" ]; then
            echo "::error::Open VSX publishing requested but OVSX_PAT is not set."
            fail=1
          fi
          exit $fail

      - name: Lint, typecheck, test
        run: bun run lint && bun run typecheck && bun run test:coverage

      - name: Package
        run: bun run package

      - name: Resolve the built VSIX
        id: vsix
        run: |
          count=$(ls -1 release/*.vsix 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one VSIX in release/, found $count."
            exit 1
          fi
          path=$(ls release/*.vsix)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Publishing $path"
          echo "  version:   $(node -p "require('./package.json').version")"
          echo "  publisher: $(node -p "require('./package.json').publisher")"

      # Secrets go through the environment: both tools read these names, and
      # argv is readable from the runner's process table.
      - name: Publish to VS Code Marketplace
        if: inputs.marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bunx vsce publish --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Publish to Open VSX
        if: inputs.openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bunx ovsx publish "${{ steps.vsix.outputs.path }}"

  # The command line and MCP server on npm, for CI and for every host that is
  # not VS Code. Published with the NPM_TOKEN secret, the same token the rest
  # of the family's packages use, so the first release of a new package needs
  # no setup on the registry beforehand. `id-token: write` is here for
  # provenance only: npm signs the package as built by this workflow, and that
  # permission should not be held by a job handling the VSIX registry tokens.
  npm:
    if: inputs.npm
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With a registry URL, setup-node writes an .npmrc that reads the token
      # from NODE_AUTH_TOKEN, so it is never written to disk or passed in argv.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs before anything irreversible, as the VSIX job's check does.
      - name: Check the npm credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::npm publishing requested but NPM_TOKEN is not set."
            exit 1
          fi

      # Before anything irreversible: a published version can never be reused,
      # and the unpublish window is 72 hours.
      - name: Refuse to republish an existing version
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./npm/package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published — bump the version first."
            exit 1
          fi
          echo "Publishing $name@$version"

      # Builds npm/, runs the bundle as a process, and checks that only the
      # bundle, its manifest, the readme and the license would be uploaded.
      - name: Build and gate the package
        run: bun run test:cli

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./npm --access public
